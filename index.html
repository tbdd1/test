<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>啵啵 Soft Bubbles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #5a4a62;
      --ink-soft: #7a6a82;
      --glass: rgba(255, 255, 255, 0.42);
      --glass-border: rgba(255, 255, 255, 0.65);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 70% at 15% 20%, #ffe4f0 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 85% 15%, #d9f0ff 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 70% 85%, #e8ddff 0%, transparent 55%),
        radial-gradient(ellipse 60% 45% at 20% 90%, #dff5e8 0%, transparent 50%),
        linear-gradient(165deg, #fff5f8 0%, #f0f7ff 45%, #f6f0ff 100%);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .brand {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      z-index: 2;
      pointer-events: none;
      animation: fade-in 1.1s ease both;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink-soft);
    }

    .hud {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fade-in 1.1s ease 0.15s both;
    }

    .stat {
      min-width: 72px;
      padding: 8px 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      text-align: center;
    }

    .stat .label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .stat .value {
      display: block;
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.2;
    }

    #mute {
      width: 44px;
      height: 44px;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 1.15rem;
      cursor: pointer;
      color: var(--ink);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #mute:hover { background: rgba(255, 255, 255, 0.62); }
    #mute:active { transform: scale(0.94); }

    .hint {
      position: fixed;
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      margin: 0;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-soft);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      animation: hint-pulse 3.2s ease-in-out infinite, fade-in 1.4s ease 0.4s both;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .hint.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes hint-pulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="泡泡游戏画布"></canvas>

  <header class="brand">
    <h1>啵啵</h1>
    <p>Soft Bubbles</p>
  </header>

  <div class="hud" aria-live="polite">
    <div class="stat">
      <span class="label">分数</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="stat">
      <span class="label">连击</span>
      <span class="value" id="combo">x1</span>
    </div>
    <div class="stat">
      <span class="label">最高</span>
      <span class="value" id="best">0</span>
    </div>
    <button type="button" id="mute" aria-label="静音切换" title="静音">🔊</button>
  </div>

  <p class="hint" id="hint">点一点泡泡，慢慢呼气</p>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const comboEl = document.getElementById("combo");
      const bestEl = document.getElementById("best");
      const muteBtn = document.getElementById("mute");
      const hintEl = document.getElementById("hint");

      const COLORS = ["#F8C8DC", "#C8E7F5", "#D4C4F7", "#C9E4CA", "#FFE5B4", "#F5D0E8", "#B8E0D2"];
      const HS_KEY = "soft-bubble-high-score";
      const COMBO_WINDOW = 800;
      const COMBO_CAP = 10;

      let W = 0, H = 0;
      let bubbles = [];
      let particles = [];
      let floatTexts = [];
      let score = 0;
      let combo = 1;
      let bestCombo = 1;
      let lastPop = 0;
      let highScore = Number(localStorage.getItem(HS_KEY) || 0);
      let muted = false;
      let audioCtx = null;
      let spawnAcc = 0;
      let poppedOnce = false;
      let lastTs = 0;

      bestEl.textContent = String(highScore);

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }

      function pick(arr) {
        return arr[(Math.random() * arr.length) | 0];
      }

      function spawnBubble(forceCalm) {
        const calm = forceCalm === true || Math.random() < 0.08;
        const r = calm ? rand(48, 72) : rand(18, 42);
        bubbles.push({
          x: rand(r + 8, Math.max(r + 9, W - r - 8)),
          y: H + r + rand(10, 80),
          r,
          vx: rand(-18, 18),
          vy: -rand(28, 55) * (calm ? 0.75 : 1),
          wobble: rand(0, Math.PI * 2),
          wobbleSpeed: rand(0.8, 1.6),
          color: pick(COLORS),
          calm,
          alpha: 0.72,
        });
      }

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function playPop(calm) {
        if (muted) return;
        const ac = ensureAudio();
        if (!ac) return;

        const t0 = ac.currentTime;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        const filter = ac.createBiquadFilter();

        osc.type = "sine";
        osc.frequency.setValueAtTime(calm ? 320 : rand(480, 720), t0);
        osc.frequency.exponentialRampToValueAtTime(calm ? 120 : 180, t0 + (calm ? 0.28 : 0.12));

        filter.type = "lowpass";
        filter.frequency.value = 1800;

        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(calm ? 0.12 : 0.08, t0 + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (calm ? 0.32 : 0.14));

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        osc.start(t0);
        osc.stop(t0 + 0.35);
      }

      function burst(b) {
        const n = b.calm ? 18 : 10 + ((Math.random() * 6) | 0);
        for (let i = 0; i < n; i++) {
          const ang = (Math.PI * 2 * i) / n + rand(-0.2, 0.2);
          const sp = rand(40, b.calm ? 160 : 110);
          particles.push({
            x: b.x,
            y: b.y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp,
            r: rand(2, b.calm ? 7 : 5),
            life: 1,
            decay: rand(1.4, 2.4),
            color: b.color,
          });
        }
      }

      function addFloatText(x, y, text, calm) {
        floatTexts.push({
          x, y,
          text,
          life: 1,
          vy: -36,
          calm,
        });
      }

      function popBubble(b, index) {
        const now = performance.now();
        if (now - lastPop < COMBO_WINDOW) {
          combo = Math.min(combo + 1, COMBO_CAP);
        } else {
          combo = 1;
        }
        lastPop = now;
        if (combo > bestCombo) bestCombo = combo;

        const base = Math.round(b.r * 0.4) * (b.calm ? 3 : 1);
        const gain = base * combo;
        score += gain;
        if (score > highScore) {
          highScore = score;
          localStorage.setItem(HS_KEY, String(highScore));
        }

        scoreEl.textContent = String(score);
        comboEl.textContent = "x" + combo;
        bestEl.textContent = String(highScore);

        burst(b);
        addFloatText(b.x, b.y - b.r * 0.2, "+" + gain, b.calm);
        playPop(b.calm);
        bubbles.splice(index, 1);

        if (!poppedOnce) {
          poppedOnce = true;
          hintEl.classList.add("hide");
        }
      }

      function hitTest(x, y) {
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          const dx = x - b.x;
          const dy = y - b.y;
          if (dx * dx + dy * dy <= b.r * b.r) return i;
        }
        return -1;
      }

      function onPointer(e) {
        e.preventDefault();
        ensureAudio();
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX ?? e.touches?.[0]?.clientX) - rect.left;
        const y = (e.clientY ?? e.touches?.[0]?.clientY) - rect.top;
        const i = hitTest(x, y);
        if (i >= 0) popBubble(bubbles[i], i);
      }

      function drawBubble(b) {
        const g = ctx.createRadialGradient(
          b.x - b.r * 0.35,
          b.y - b.r * 0.4,
          b.r * 0.1,
          b.x,
          b.y,
          b.r
        );
        g.addColorStop(0, "rgba(255,255,255,0.85)");
        g.addColorStop(0.35, b.color);
        g.addColorStop(1, "rgba(255,255,255,0.15)");

        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.globalAlpha = b.alpha;
        ctx.fill();
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.ellipse(
          b.x - b.r * 0.32,
          b.y - b.r * 0.38,
          b.r * 0.22,
          b.r * 0.14,
          -0.5,
          0,
          Math.PI * 2
        );
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.globalAlpha = 1;

        if (b.calm) {
          ctx.globalAlpha = 0.35;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2);
          ctx.strokeStyle = b.color;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.033, (ts - lastTs) / 1000);
        lastTs = ts;

        spawnAcc += dt;
        const target = bubbles.length < 10 ? 0.35 : bubbles.length < 22 ? 0.55 : 0.9;
        while (spawnAcc >= target && bubbles.length < 28) {
          spawnAcc -= target;
          spawnBubble();
        }

        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          b.wobble += b.wobbleSpeed * dt;
          b.x += (b.vx + Math.sin(b.wobble) * 12) * dt;
          b.y += b.vy * dt;
          if (b.y + b.r < -20 || b.x < -b.r - 40 || b.x > W + b.r + 40) {
            bubbles.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 40 * dt;
          p.life -= p.decay * dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = floatTexts.length - 1; i >= 0; i--) {
          const f = floatTexts[i];
          f.y += f.vy * dt;
          f.life -= 1.2 * dt;
          if (f.life <= 0) floatTexts.splice(i, 1);
        }

        if (performance.now() - lastPop > COMBO_WINDOW && combo !== 1 && lastPop > 0) {
          combo = 1;
          comboEl.textContent = "x1";
        }

        ctx.clearRect(0, 0, W, H);

        for (const b of bubbles) drawBubble(b);

        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (const f of floatTexts) {
          ctx.globalAlpha = Math.max(0, f.life);
          ctx.font = `800 ${f.calm ? 22 : 16}px Nunito, sans-serif`;
          ctx.fillStyle = f.calm ? "#7a5cff" : "#5a4a62";
          ctx.textAlign = "center";
          ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;

        requestAnimationFrame(tick);
      }

      muteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        muted = !muted;
        muteBtn.textContent = muted ? "🔇" : "🔊";
        muteBtn.setAttribute("aria-label", muted ? "取消静音" : "静音");
        if (!muted) ensureAudio();
      });

      canvas.addEventListener("pointerdown", onPointer);
      window.addEventListener("resize", resize);

      resize();
      for (let i = 0; i < 10; i++) {
        spawnBubble();
        const b = bubbles[bubbles.length - 1];
        b.y = rand(H * 0.2, H * 0.95);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
